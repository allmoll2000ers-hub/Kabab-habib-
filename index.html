<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موقع مطعم كباب حبيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@700&display=swap">
<style>
:root{--red1:#DB1D2D;--red2:#A80E22;--cream:#FFF1D0;--deep:#8E0F22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,var(--red1),var(--red2) 80%);color:var(--cream);font-family:'Cairo',Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:22px 18px 28px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px}
.logo{width:150px;height:auto;border-radius:50%;box-shadow:0 4px 16px rgba(0,0,0,.3)}
h1{font-family:'Aref Ruqaa','Traditional Arabic',serif;font-size:44px;margin:2px 0 0}
.addr{margin:0;font-size:18px;text-align:center;opacity:.95}
.mapbtn{all:unset;display:block;width:100%;border-radius:20px;overflow:hidden;border:3px solid var(--cream);box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;position:relative}
.map{display:block;width:100%;height:auto}
.hint{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(120,8,24,.85));color:var(--cream);text-align:center;padding:26px 8px 10px;font-size:16px}
.go{all:unset;display:block;width:100%;text-align:center;background:var(--cream);color:var(--deep);border-radius:16px;padding:15px;font-size:19px;cursor:pointer}
.pulse circle{transform-origin:200px 108px;animation:p 2s ease-out infinite}
@keyframes p{from{transform:scale(.5);opacity:.4}to{transform:scale(1.6);opacity:0}}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;inset-inline:0;bottom:0;margin:0 auto;max-width:480px;background:var(--cream);color:var(--deep);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s;display:flex;flex-direction:column;gap:10px}
.open .back{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.sheet h2{margin:0 0 4px;text-align:center;font-size:19px}
.opt{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;background:#fff;border:1.5px solid #E5D3B0;color:var(--deep);text-decoration:none;font-size:18px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.cancel{all:unset;text-align:center;padding:12px;font-size:16px;opacity:.7;cursor:pointer}
</style></head><body>
<main>
<svg id="logo" class="logo" viewBox="0 0 380 380" role="img" xmlns="http://www.w3.org/2000/svg"><title>شعار مطعم كباب حبيب</title><desc>شعار دائري بخلفية حمراء وحلقة بيضاء، الاسم بخط الرقعة بحجم كبير، وتحته الاسم الإنجليزي وعبارة منذ 2007، ولهب يخرج من حافة الدائرة السفلية، وفي الأسفل الاسم الإنجليزي</desc><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE08A"/><stop offset="0.55" stop-color="#E0A93B"/><stop offset="1" stop-color="#B9822A"/></linearGradient><linearGradient id="meat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2794A"/><stop offset="0.5" stop-color="#9A431D"/><stop offset="1" stop-color="#5C220F"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F4F4"/><stop offset="0.5" stop-color="#A0A0A0"/><stop offset="1" stop-color="#E6E6E6"/></linearGradient><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07C4A"/><stop offset="1" stop-color="#6A4020"/></linearGradient><linearGradient id="fOrg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB03B"/><stop offset="1" stop-color="#F26B1D"/></linearGradient><linearGradient id="fYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEFA0"/><stop offset="1" stop-color="#FFC247"/></linearGradient><radialGradient id="bgR" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#DB1D2D"/><stop offset="1" stop-color="#BC1026"/></radialGradient><clipPath id="inner"><circle cx="190" cy="190" r="155"/></clipPath></defs><rect x="0" y="0" width="380" height="380" fill="#FFFFFF"/><circle cx="190" cy="190" r="178" fill="#FFFFFF" stroke="#BC1026" stroke-width="3"/><circle cx="190" cy="190" r="166" fill="url(#bgR)"/><circle cx="190" cy="190" r="156" fill="none" stroke="#FFF1D0" stroke-width="1.6"/><g stroke="#FFF1D0" stroke-width="1.6" stroke-linecap="round"><line x1="104" y1="121" x2="146" y2="121"/><line x1="234" y1="121" x2="276" y2="121"/></g><rect x="-3.5" y="-3.5" width="7" height="7" fill="#FFF1D0" transform="translate(98 121) rotate(45)"/><rect x="-3.5" y="-3.5" width="7" height="7" fill="#FFF1D0" transform="translate(282 121) rotate(45)"/><text x="190" y="297" font-family="'Aref Ruqaa','Traditional Arabic',Tahoma,serif" font-size="23" font-weight="700" fill="#FFF1D0" text-anchor="middle" direction="rtl" textLength="80" lengthAdjust="spacingAndGlyphs">منذ ٢٠٠٧</text><text x="190" y="132" font-family="'Aref Ruqaa','Traditional Arabic',Tahoma,serif" font-size="30" font-weight="700" fill="#FFF1D0" text-anchor="middle" direction="rtl" textLength="70" lengthAdjust="spacingAndGlyphs">مطعم</text><text x="190" y="215.5" font-family="'Aref Ruqaa','Traditional Arabic',Tahoma,serif" font-size="82" font-weight="700" fill="#FFF1D0" text-anchor="middle" direction="rtl" textLength="262" lengthAdjust="spacingAndGlyphs">كباب حبيب</text><text x="190" y="258" font-family="'Playfair Display',Georgia,serif" font-size="17" font-weight="700" letter-spacing="5" fill="#FFF1D0" text-anchor="middle" textLength="160" lengthAdjust="spacing">KABAB HABIB</text></svg>
<h1>موقعنا</h1>
<p class="addr">كربلاء – شارع الشيخ أحمد الوائلي</p>
<button class="mapbtn" id="m" aria-label="افتح الخريطة"><svg viewBox="0 0 400 300" class="map" role="img" aria-label="خريطة تقريبية لموقع المطعم">
<rect width="400" height="300" fill="#F7E7CF"/>
<path d="M-10 230 C80 190 150 250 240 215 S380 170 420 190 L420 230 C380 215 300 260 240 255 S90 235 -10 275Z" fill="#F2B9A6" opacity="0.55"/>
<g stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-10 90 L410 60"/><path d="M60 -10 L130 310"/><path d="M270 -10 L230 310"/><path d="M-10 170 L410 150"/></g>
<g stroke="#E9CBA4" stroke-width="3" fill="none"><path d="M-10 40 L410 20"/><path d="M-10 130 L410 112"/><path d="M-10 215 L410 205"/><path d="M180 -10 L170 310"/><path d="M340 -10 L320 310"/><path d="M10 -10 L40 310"/></g>
<rect x="288" y="78" width="70" height="44" rx="8" fill="#CFE3B8" opacity="0.8"/>
<rect x="84" y="176" width="64" height="40" rx="8" fill="#CFE3B8" opacity="0.8"/>
<text x="200" y="176" font-size="13" font-weight="700" fill="#9A7A52" text-anchor="middle" transform="rotate(-3 200 176)" style="font-family:'Cairo',Tahoma,sans-serif">شارع الشيخ أحمد الوائلي</text>
<g class="pulse"><circle cx="200" cy="108" r="30" fill="#BC1026" opacity="0.18"/></g>
<path d="M200 70 c-17 0 -28 13 -28 28 c0 21 28 46 28 46 c0 0 28 -25 28 -46 c0 -15 -11 -28 -28 -28z" fill="#BC1026" stroke="#FFF1D0" stroke-width="3"/>
<circle cx="200" cy="98" r="10" fill="#FFF1D0"/>
</svg><span class="hint">اضغط على الخريطة لفتح الموقع</span></button>
<button class="go" id="g">افتح الموقع</button>
</main>
<div id="r"><div class="back" id="b"></div>
<div class="sheet" role="dialog" aria-label="اختر تطبيق الخرائط"><h2>افتح الموقع بواسطة</h2>
<a class="opt" href="https://www.google.com/maps/search/?api=1&query=%D9%85%D8%B7%D8%B9%D9%85%20%D9%83%D8%A8%D8%A7%D8%A8%20%D8%AD%D8%A8%D9%8A%D8%A8%20%D9%83%D8%B1%D8%A8%D9%84%D8%A7%D8%A1%20%D8%B4%D8%A7%D8%B1%D8%B9%20%D8%A7%D9%84%D8%B4%D9%8A%D8%AE%20%D8%A3%D8%AD%D9%85%D8%AF%20%D8%A7%D9%84%D9%88%D8%A7%D8%A6%D9%84%D9%8A" target="_blank" rel="noopener noreferrer"><span class="dot" style="background:#34A853"></span>خرائط جوجل</a>
<a class="opt" href="https://waze.com/ul?q=%D9%85%D8%B7%D8%B9%D9%85%20%D9%83%D8%A8%D8%A7%D8%A8%20%D8%AD%D8%A8%D9%8A%D8%A8%20%D9%83%D8%B1%D8%A8%D9%84%D8%A7%D8%A1%20%D8%B4%D8%A7%D8%B1%D8%B9%20%D8%A7%D9%84%D8%B4%D9%8A%D8%AE%20%D8%A3%D8%AD%D9%85%D8%AF%20%D8%A7%D9%84%D9%88%D8%A7%D8%A6%D9%84%D9%8A&navigate=yes" target="_blank" rel="noopener noreferrer"><span class="dot" style="background:#33CCFF"></span>Waze</a>
<button class="cancel" id="c">إلغاء</button></div></div>
<script>
const r=document.getElementById('r'),o=()=>r.classList.add('open'),c=()=>r.classList.remove('open');
document.getElementById('m').onclick=o;document.getElementById('g').onclick=o;document.getElementById('b').onclick=c;document.getElementById('c').onclick=c;
document.addEventListener('keydown',e=>{if(e.key==='Escape')c()});
</script></body></html>
